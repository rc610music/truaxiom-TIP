name: TIP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/tip-runtime-001
      - codex/runtime-002-integration-20261018
      - codex/taxis-reactive-wake-20261024

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check repository structure
        run: npm run check:structure

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Validate TIP Runtime 001
        run: npm run test:runtime-001

      - name: Validate TIP Runtime 002 lifecycle and restart persistence
        run: npm run test:runtime-002

      - name: Validate TIP Runtime 003 worker and bridge
        run: npm run test:runtime-003

      - name: Validate bounded wake dispatch and durable recovery
        run: npm run test:runtime-wake

      - name: Validate transactional runtime delivery and restart recovery
        run: npm run test:runtime-delivery

      - name: Validate isolated worker and delivery heartbeat
        run: npm run test:runtime-heartbeat

      - name: Validate independent verification beside the completed heartbeat
        run: npm run test:independent-verification

